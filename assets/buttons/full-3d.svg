<svg xmlns="http://www.w3.org/2000/svg" width="250" height="52" viewBox="0 0 250 52" role="img" aria-label="FULL 3D PORTFOLIO ENTER // IMMERSIVE">
  <defs>
    <filter id="g" x="-50%" y="-100%" width="200%" height="300%">
      <feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="1" y="1" width="248" height="50" rx="8" fill="#0D1117" stroke="#30363D"/>
  <rect x="1" y="1" width="248" height="50" rx="8" fill="none" stroke="#FD5812" stroke-opacity=".18">
    <animate attributeName="stroke-opacity" values=".12;.58;.12" dur="2.8s" repeatCount="indefinite"/>
  </rect>
  <circle cx="18" cy="26" r="4" fill="#FD5812" filter="url(#g)">
    <animate attributeName="r" values="3;5;3" dur="1.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".45;1;.45" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <text x="32" y="23" font-family="'JetBrains Mono','Consolas',monospace" font-size="12.5" font-weight="700" fill="#E6EDF3" letter-spacing="1">FULL 3D PORTFOLIO</text>
  <text x="32" y="38" font-family="'JetBrains Mono','Consolas',monospace" font-size="9.5" fill="#FD5812" letter-spacing="1.5">ENTER // IMMERSIVE</text>
  <line x1="14" y1="48" x2="236" y2="48" stroke="#FD5812" stroke-width="2" stroke-linecap="round" stroke-dasharray="58 250">
    <animate attributeName="stroke-dashoffset" values="250;0;-250" dur="3.2s" repeatCount="indefinite"/>
  </line>
</svg>