<svg xmlns="http://www.w3.org/2000/svg" width="185" height="52" viewBox="0 0 185 52" role="img" aria-label="FRONTEND OPEN // CLIENT">
  <defs>
    <filter id="g" x="-50%" y="-100%" width="200%" height="300%">
      <feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="1" y="1" width="183" height="50" rx="8" fill="#0D1117" stroke="#30363D"/>
  <rect x="1" y="1" width="183" height="50" rx="8" fill="none" stroke="#FD5812" stroke-opacity=".18">
    <animate attributeName="stroke-opacity" values=".12;.58;.12" dur="2.8s" repeatCount="indefinite"/>
  </rect>
  <circle cx="18" cy="26" r="4" fill="#FD5812" filter="url(#g)">
    <animate attributeName="r" values="3;5;3" dur="1.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".45;1;.45" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <text x="32" y="23" font-family="'JetBrains Mono','Consolas',monospace" font-size="12.5" font-weight="700" fill="#E6EDF3" letter-spacing="1">FRONTEND</text>
  <text x="32" y="38" font-family="'JetBrains Mono','Consolas',monospace" font-size="9.5" fill="#FD5812" letter-spacing="1.5">OPEN // CLIENT</text>
  <line x1="14" y1="48" x2="171" y2="48" stroke="#FD5812" stroke-width="2" stroke-linecap="round" stroke-dasharray="58 185">
    <animate attributeName="stroke-dashoffset" values="185;0;-185" dur="3.2s" repeatCount="indefinite"/>
  </line>
</svg>