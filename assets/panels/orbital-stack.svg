<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-label="WAI Orbital Stack active modules">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#070a10"/><stop offset="1" stop-color="#0d1117"/></linearGradient>
  <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1200" height="430" rx="20" fill="url(#bg)" stroke="#253242"/>
<path d="M36 54H1164M36 385H1164" stroke="#253242"/>
<g font-family="'JetBrains Mono','Consolas',monospace">
  <text x="42" y="35" font-size="12" fill="#8b949e" letter-spacing="3">ORBITAL STACK // ACTIVE MODULES</text>
  <text x="1015" y="35" font-size="11" fill="#FD5812" letter-spacing="2">SYSTEM ONLINE</text>
</g>
<circle cx="992" cy="31" r="4" fill="#FD5812" filter="url(#glow)"><animate attributeName="opacity" values=".25;1;.25" dur="1.5s" repeatCount="indefinite"/></circle>

<g stroke="#253242" fill="#0b1018">
  <rect x="42" y="78" width="1116" height="54" rx="10"/>
  <rect x="42" y="143" width="1116" height="54" rx="10"/>
  <rect x="42" y="208" width="1116" height="54" rx="10"/>
  <rect x="42" y="273" width="1116" height="54" rx="10"/>
  <rect x="42" y="338" width="1116" height="34" rx="10"/>
</g>

<g font-family="'JetBrains Mono','Consolas',monospace">
