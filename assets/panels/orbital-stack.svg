</g>

<g fill="#FD5812">
  <circle cx="1128" cy="105" r="5"><animate attributeName="opacity" values=".2;1;.2" dur="1.6s" repeatCount="indefinite"/></circle>
  <circle cx="1128" cy="170" r="5"><animate attributeName="opacity" values=".2;1;.2" dur="1.6s" begin=".25s" repeatCount="indefinite"/></circle>
  <circle cx="1128" cy="235" r="5"><animate attributeName="opacity" values=".2;1;.2" dur="1.6s" begin=".5s" repeatCount="indefinite"/></circle>
