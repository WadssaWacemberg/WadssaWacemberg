  <circle cx="1128" cy="355" r="5"><animate attributeName="opacity" values=".2;1;.2" dur="1.6s" begin="1s" repeatCount="indefinite"/></circle>
</g>

<g stroke="#FD5812" stroke-opacity=".34">
  <line x1="42" y1="68" x2="42" y2="382"/>
  <line x1="1158" y1="68" x2="1158" y2="382"/>
</g>

<g>
